# BIRD2 anycast announcement — starting point
#
# Goal: announce one /48 from this node, withdraw it when the local service is
# unhealthy. Validate before starting:  bird -p -c /etc/bird/bird.conf
# Then: systemctl restart bird2 && birdc show protocols

router id 192.0.2.10;          # any stable IPv4 on the node; required even when
                               # the node only announces IPv6

protocol device {}

# ---------------------------------------------------------------------------
# The announcement trigger.
#
# The daemon exports what its RIB says is reachable, and a static route is
# always reachable. So THIS protocol's enable/disable state is the announce/
# withdraw switch. The health-check script does nothing but toggle it:
#
#   birdc disable anycast_v6    # withdraw the prefix
#   birdc enable  anycast_v6    # announce it
#
# `blackhole` is intentional: a locally bound /128 is more specific than this
# /48, so the service address still receives traffic while unbound addresses
# in the prefix are dropped locally instead of looping.
# ---------------------------------------------------------------------------
protocol static anycast_v6 {
    ipv6;
    route 2a14:7583:ff60:1::/48 blackhole;
}

# ---------------------------------------------------------------------------
# Upstream session. `import none` because you are not taking a table.
# `export where net = ...` so nothing but your prefix can ever leak.
#
# Variant A — provider gives you an IPv6 neighbour (preferred):
# ---------------------------------------------------------------------------
protocol bgp upstream_v6 {
    local as 64500;                        # your own ASN
    neighbor 2001:db8::1 as 64501;         # provider's v6 neighbour + ASN
    # password "...";                     # only if the provider requires MD5
    ipv6 {
        import none;
        export where net = 2a14:7583:ff60:1::/48;
    };
}

# ---------------------------------------------------------------------------
# Variant B — provider only offers an IPv4 session, but you still need to
# originate IPv6 (MP-BGP, RFC 4760). Delete Variant A and use this instead:
#
# protocol bgp upstream_v4 {
#     local as 64500;
#     neighbor 198.51.100.1 as 64501;
#     ipv4 {
#         import none;
#         export none;
#     };
#     ipv6 {
#         import none;
#         export where net = 2a14:7583:ff60:1::/48;
#     };
# }
# ---------------------------------------------------------------------------
#
# On the host itself, one address out of the /48 is bound to lo — the /48 does
# not sit "on" an interface, an address from it does:
#
#   ip -6 addr add 2a14:7583:ff60:1::53/128 dev lo
#   ip -6 route add 2a14:7583:ff60:1::/48 dev lo    # optional, local delivery
#
# Verify after start:
#   birdc show protocols                  -> upstream_v6 Established
#   birdc show route export upstream_v6   -> exactly the /48, nothing else
#   (external) bgp.tools / bgp.he.net     -> prefix visible, RPKI Valid,
#                                            origin = your ASN
