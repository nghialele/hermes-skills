name: index

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint the skill frontmatter
        run: python scripts/build_index.py --lint
      - name: The table must match skills/
        run: python scripts/build_index.py --check
